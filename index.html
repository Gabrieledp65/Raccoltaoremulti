/* --- FIX BUG ACCUMULO ORE ---
   minutesForDay ora usa una vera macchina a stati: ogni nuovo evento di
   "apertura" (work_start / travel_start / break_start) chiude PRIMA
   qualsiasi altro segmento aperto in modo incompatibile (evita che
   lavoro e viaggio si sovrappongano e si sommino a vicenda), e un evento
   di apertura ripetuto senza chiusura viene ignorato (non sovrascrive
   l'orario di inizio già registrato, così non si perdono né si
   raddoppiano minuti). day_end / outside_end / overnight chiudono
   sempre ogni segmento eventualmente ancora aperto in quel giorno.
   In più vengono registrati i singoli segmenti di lavoro (workSegments)
   con orario di inizio/fine, necessari per calcolare correttamente la
   ripartizione diurno/notturno e ordinario/straordinario. */
function dayNightSplit(startHM, endHM) {
  let [sh, sm] = startHM.split(":").map(Number);
  let [eh, em] = endHM.split(":").map(Number);
  let start = sh * 60 + sm;
  let end = eh * 60 + em;
  if (end <= start) end += 1440;

  let day = 0, night = 0;
  for (let m = start; m < end; m++) {
    let mod = m % 1440;
    if (mod >= 360 && mod < 1320) {
      day++;
    } else {
      night++;
    }
  }
  return { day, night };
}

function addMinutes(timeHM, mins) {
  let [h, m] = timeHM.split(":").map(Number);
  let total = (h * 60 + m + mins) % 1440;
  if (total < 0) total += 1440;
  let nh = Math.floor(total / 60);
  let nm = total % 60;
  return String(nh).padStart(2, "0") + ":" + String(nm).padStart(2, "0");
}

      +'<td class="valcol">'+fmtMin(m.workDay)+'</td>'

  }

    +'<td class="valcol tot-work">'+fmtMin(s.work)+'</td>'

function boot(){
  onAuthStateChanged(auth, async (u) => {
    if(session) return;
    if(u){
      try{
        let s = await getDoc(doc(usersCol, u.uid));
        if(s.exists()){
          let d = s.data();
          session = {
            uid: u.uid,
            username: d.username,
            usernameLower: d.usernameLower,
            role: d.role || "user",
            language: d.language || "it",
            pagaMensile: +d.pagaMensile || CCNL_CONFIG.minimumMonthly,
            percentualeOraViaggio: d.percentualeOraViaggio ?? 100,
            indennitaTrasferta: +d.indennitaTrasferta || 0,
            indennitaTrasfertaFactor: +d.indennitaTrasfertaFactor || 1,
            indennitaTrasfertaTaxable: !!d.indennitaTrasfertaTaxable,
            ferieResidueIniziali: +d.ferieResidueIniziali || 0,
            rolResidueIniziali: +d.rolResidueIniziali || 0,
            exfestResidueIniziali: +d.exfestResidueIniziali || 0,
            ferieMaturazioneMensile: +d.ferieMaturazioneMensile || CCNL_CONFIG.accrual.ferie,
            rolMaturazioneMensile: +d.rolMaturazioneMensile || CCNL_CONFIG.accrual.rol,
            exfestMaturazioneMensile: +d.exfestMaturazioneMensile || CCNL_CONFIG.accrual.exfest
          };
          saveSession();
          if(session.role === "admin") enterAdmin();
          else enterApp();
          return;
        }
      }catch(e){ console.error(e); }
    }
    clearSession();
    show("loginView");
    setLang("it");
  });
}
boot();
