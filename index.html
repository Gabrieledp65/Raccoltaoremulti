function dayNightSplit(startHM, endHM) {
  if (startHM === endHM) return { day: 0, night: 0 };
  let [sh, sm] = startHM.split(":").map(Number);
  let [eh, em] = endHM.split(":").map(Number);
  let start = sh * 60 + sm;
  let end = eh * 60 + em;
  if (end < start) end += 1440;

  let day = 0, night = 0;
  for (let m = start; m < end; m++) {
    let mod = m % 1440;
    if (mod >= 360 && mod < 1320) {
      day++;
    } else {
      night++;
    }
  }
  return { day, night };
}

function addMinutes(timeHM, mins) {
  let [h, m] = timeHM.split(":").map(Number);
  let total = (h * 60 + m + mins) % 1440;
  if (total < 0) total += 1440;
  let nh = Math.floor(total / 60);
  let nm = total % 60;
  return String(nh).padStart(2, "0") + ":" + String(nm).padStart(2, "0");
}

function minutesForDay(es){let work=0,workDay=0,workNight=0,travel=0,travelDay=0,travelNight=0,br=0,workSegments=[],travelSegments=[],ws=null,ts=null,bs=null,sorted=es.slice().sort(compareEvents);
 function cw(t){if(ws){let d=minDiff(ws,t),x=dayNightSplit(ws,t);work+=d;workDay+=x.day;workNight+=x.night;workSegments.push({start:ws,end:t});ws=null}}
 function ct(t){if(ts){let d=minDiff(ts,t),x=dayNightSplit(ts,t);travel+=d;travelDay+=x.day;travelNight+=x.night;travelSegments.push({start:ts,end:t});ts=null}}
 function cb(t){if(bs){br+=minDiff(bs,t);bs=null}}
 for(const e of sorted){let t=e.time;if(!t)continue;if(e.type==="work_start"){ct(t);cb(t);if(!ws)ws=t}else if(e.type==="break_start"){cw(t);ct(t);if(!bs)bs=t}else if(e.type==="break_end"){cb(t);if(!ws)ws=t}else if(e.type==="work_end"){cw(t);cb(t)}else if(e.type==="travel_start"){cw(t);cb(t);if(!ts)ts=t}else if(e.type==="travel_end")ct(t);else if(e.type==="day_end"||e.type==="outside_end"||e.type==="overnight"){cw(t);ct(t);cb(t)}}
 return {work,workDay,workNight,travel,travelDay,travelNight,br,workSegments,travelSegments};}

function dayType(iso){const d=parseDate(iso).getDay();return d===0?"sunday":d===6?"saturday":"weekday"}

const PAY_RULES={
  weekdayDailyCapMin:480,
  weekdayNightOrdinaryPct:25,
  weekdayNightOvertimePct:50,
  saturdayDayFirst2hPct:25,
  saturdayDayBeyondPct:30,
  saturdayNightPct:50,
  sundayDayPct:50,
  sundayNightPct:60
};

function classifyWorkSegments(segments,capMinTotal){
  let cum=0,ordDay=0,ordNight=0,otDay=0,otNight=0;
  for(const seg of segments){
    const segMin=minDiff(seg.start,seg.end);
    const remainingOrdinary=Math.max(0,capMinTotal-cum);
    const ordPortion=Math.min(segMin,remainingOrdinary);
    const otPortion=segMin-ordPortion;
    if(ordPortion>0){
      const ordEnd=addMinutes(seg.start,ordPortion);
      const sp=dayNightSplit(seg.start,ordEnd);
      ordDay+=sp.day;ordNight+=sp.night;
    }
    if(otPortion>0){
      const otStart=addMinutes(seg.start,ordPortion);
      const sp=dayNightSplit(otStart,seg.end);
      otDay+=sp.day;otNight+=sp.night;
    }
    cum+=segMin;
  }
  return {ordDay,ordNight,otDay,otNight};
}

function splitOrdinaryOvertime(iso,workSegments){
  if(dayType(iso)!=="weekday")return {ordDay:0,ordNight:0,otDay:workSegments?classifyWorkSegments(workSegments,0).otDay:0,otNight:0};
  return classifyWorkSegments(workSegments||[],PAY_RULES.weekdayDailyCapMin);
}

function dayPay(iso,m,rates,weeklyWorkedBefore=0){
 const type=dayType(iso),hourly=rates.hourly,segs=m.workSegments||[];
 let cls=type==="weekday"?classifyWorkSegments(segs,Math.min(PAY_RULES.weekdayDailyCapMin,Math.max(0,2400-weeklyWorkedBefore))):classifyWorkSegments(segs,0);
 let {ordDay:ordDayMin,ordNight:ordNightMin,otDay:otDayMin,otNight:otNightMin}=cls,payOrdinaryDay=ordDayMin/60*hourly,payOrdinaryNight=ordNightMin/60*hourly*(1+PAY_RULES.weekdayNightOrdinaryPct/100),payOvertimeDay=0,payOvertimeNight=0;
 if(type==="weekday"){payOvertimeDay=otDayMin/60*hourly*(1+rates.otPct/100);payOvertimeNight=otNightMin/60*hourly*(1+PAY_RULES.weekdayNightOvertimePct/100)}
 else if(type==="saturday"){let x=Math.min(otDayMin,120),y=Math.max(0,otDayMin-120);payOvertimeDay=x/60*hourly*1.25+y/60*hourly*1.30;payOvertimeNight=otNightMin/60*hourly*1.50}
 else {payOvertimeDay=otDayMin/60*hourly*1.50;payOvertimeNight=otNightMin/60*hourly*1.60}
 let payTravelDay=(m.travelDay||0)/60*hourly*(rates.travelPct/100),payTravelNight=(m.travelNight||0)/60*hourly*(rates.travelPct/100)*1.25,payTravel=payTravelDay+payTravelNight,payOrdinary=payOrdinaryDay+payOrdinaryNight,payOvertime=payOvertimeDay+payOvertimeNight;
 return {type,ordDayMin,ordNightMin,otDayMin,otNightMin,payOrdinaryDay,payOrdinaryNight,payOvertimeDay,payOvertimeNight,payOrdinary,payOvertime,payTravel,payTravelDay,payTravelNight,payWork:payOrdinary+payOvertime,total:payOrdinary+payOvertime+payTravel};
}

function payMap(events, ym, rates){
  let ds = [...new Set(events.filter(e => e.date?.startsWith(ym)).map(e => e.date))].sort(), map = new Map(), weeks = {};
  for(const d of ds){
    let z = parseDate(d), n = new Date(z);
    n.setDate(z.getDate() - (z.getDay() || 7) + 1);
    let k = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
    let m = minutesForDay(events.filter(e => e.date === d)), before = weeks[k] || 0;
    
    let p = dayPay(d, m, rates, before);
    map.set(d, p);
    
    if(dayType(d) === "weekday") weeks[k] = before + (p.ordDayMin + p.ordNightMin);
  }
  return map;
}

function outsideDatesInMonth(periods,ym){let set=new Set(),first=ym+"-01",last=ym+"-31";periods.forEach(p=>{let end=p.endDate||todayISO(),a=p.startDate<first?first:p.startDate,b=end>last?last:end;if(a<=b)dateRange(a,b).forEach(d=>set.add(d))});return set}

function computeSummary(events, periods, ym, rates)  {
  rates = rates || ratesOf(null);
  let pm = payMap(events, ym, rates),
      days = new Set(events.filter(e => e.date?.startsWith(ym)).map(e => e.date));
  
  outsideDatesInMonth(periods, ym).forEach(d => days.add(d));
  
  let work = 0, workDay = 0, workNight = 0, travel = 0, travelDay = 0, travelNight = 0, br = 0, workDays = 0,
      ordMinutes = 0, otMinutes = 0,
      payOrdinaryDay = 0, payOrdinaryNight = 0, payOvertimeDay = 0, payOvertimeNight = 0,
      payTravel = 0, payTravelDay = 0, payTravelNight = 0;

  for (const d of days) {
    let m = minutesForDay(events.filter(e => e.date === d)),
        p = pm.get(d) || dayPay(d, m, rates);
    
    work += m.work;
    workDay += m.workDay;
    workNight += m.workNight;
    travel += m.travel;
    travelDay += m.travelDay;
    travelNight += m.travelNight;
    br += m.br;
    if (m.work > 0) workDays++;
    
    ordMinutes += (p.ordDayMin + p.ordNightMin);
    otMinutes += (p.otDayMin + p.otNightMin);

    payOrdinaryDay += p.payOrdinaryDay;
    payOrdinaryNight += p.payOrdinaryNight;
    payOvertimeDay += p.payOvertimeDay;
    payOvertimeNight += p.payOvertimeNight;
    payTravel += p.payTravel;
    payTravelDay += p.payTravelDay;
    payTravelNight += p.payTravelNight;
  }

  let nightsCount = nightsAwayInMonth(events, ym).size;           
  let outsideDaysCount = outsideDatesInMonth(periods, ym).size;   
  
  let payAllowance = nightsCount * rates.allowance;               
  let payOrdinary = payOrdinaryDay + payOrdinaryNight;
  let payOvertime = payOvertimeDay + payOvertimeNight;
  let totalPay = payOrdinary + payOvertime + payTravel + payAllowance;

  return {
    work, workDay, workNight, travel, travelDay, travelNight, br,
    ordMinutes, otMinutes,
    outside: outsideDaysCount,                                   
    nights: nightsCount,                                         
    workDays, payOrdinaryDay, payOrdinaryNight, payOvertimeDay, payOvertimeNight,
    payOrdinary, payOvertime, payTravel, payTravelDay, payTravelNight,
    payAllowance, totalPay
  };

function openModal(title,body,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;let b=$("modalButtons");b.innerHTML="";buttons.forEach(([label,fn],i)=>{let x=document.createElement("button");x.className="btn "+(i===0?"btn-primary":"btn-secondary");x.textContent=label;x.onclick=async()=>{try{await fn()}catch(e){console.error(e);alert(e.message||"Operazione non riuscita.")}};b.appendChild(x);feedbackButton(x)});$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}

async function loginOrRegister(username,password,l){username=(username||"").trim();if(!username||!password)throw Error("Inserisci nome utente e password.");let usernameLower=username.toLowerCase();let email=syntheticEmail(username),cred;try{cred=await signInWithEmailAndPassword(auth,email,password)}catch(e){if(e.code==="auth/user-not-found"||e.code==="auth/invalid-credential"){if(usernameLower==="admin")throw Error("Le credenziali non sono corrette o l'utente non esiste.");try{cred=await createUserWithEmailAndPassword(auth,email,password);let uid=cred.user.uid;await setDoc(doc(usersCol,uid),{uid,username,usernameLower,role:"user",language:l||"it",email,tariffaOraria:0,percentualeOraViaggio:100,maggiorazioneStraordinario:0,indennitaTrasferta:0,createdAt:serverTimestamp()})}catch(createErr){throw Error(createErr.message)} }else throw e}let uid=cred.user.uid,ref=doc(usersCol,uid),snap=await getDoc(ref);if(!snap.exists())await setDoc(ref,{uid,username,usernameLower,role:"user",language:l||"it",email,tariffaOraria:0,percentualeOraViaggio:100,maggiorazioneStraordinario:0,indennitaTrasferta:0,createdAt:serverTimestamp()},{merge:true});let d=(await getDoc(ref)).data();session={uid,username:d.username||username,usernameLower:(d.usernameLower||usernameLower),role:d.role||"user",language:d.language||l||"it",tariffaOraria:+d.tariffaOraria||0,percentualeOraViaggio:d.percentualeOraViaggio??100,maggiorazioneStraordinario:+d.maggiorazioneStraordinario||0,indennitaTrasferta:+d.indennitaTrasferta||0};saveSession()}
function subscribe(){if(unsub)unsub();let q=query(entriesCol,where("uid","==",session.uid));unsub=onSnapshot(q,s=>{let all=s.docs.map(d=>Object.assign({id:d.id},d.data()));myEvents=all.filter(x=>x.kind==="event").sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||""));outsidePeriods=all.filter(x=>x.kind==="outsidePeriod");renderState();renderToday();renderHistory()},e=>console.error(e))}
function enterApp(){setLang(session.language||"it");show("appView");$("sessionUser").textContent=session.username;subscribe()}
function enterAdmin(){setLang(session.language||"it");show("adminView");$("adminSession").textContent=session.username;subscribeUsers()}
function subscribeUsers(){onSnapshot(usersCol,s=>{window.adminUsers=s.docs.map(d=>Object.assign({uid:d.id},d.data())).filter(u=>u.role!=="admin").sort((a,b)=>(a.username||"").localeCompare(b.username||""));renderAdminUsers()},e=>console.error(e))}
function renderAdminUsers(){let box=$("adminUsers"),t=T[lang];box.innerHTML="";let arr=window.adminUsers||[];if(!arr.length){box.innerHTML='<div class="empty">'+t.noData+"</div>";return}arr.forEach(u=>{let d=document.createElement("div");d.className="admin-user";d.innerHTML='<span><strong>'+safe(u.username)+'</strong><br><small>'+safe((u.language||"it").toUpperCase())+'</small></span><span class="btn-row"><button class="btn btn-secondary open-user">'+t.open+'</button><button class="btn btn-secondary pass-user">'+t.changePassword+'</button><button class="btn btn-danger del-user">'+t.deleteUser+'</button></span>';let openBtn=d.querySelector(".open-user"),passBtn=d.querySelector(".pass-user"),delBtn=d.querySelector(".del-user");openBtn.addEventListener("click",()=>openAdmin(u));passBtn.addEventListener("click",()=>adminPassword(u));delBtn.addEventListener("click",()=>deleteUser(u));box.appendChild(d);feedbackButton(openBtn);feedbackButton(passBtn);feedbackButton(delBtn)})}
function openAdmin(u){adminUser=u;$("adminReport").classList.remove("hidden");$("adminTitle").textContent="Report — "+u.username;$("adminBack").textContent=T[lang].back;adminMonthYM=currentYM();if(unsubAdmin)unsubAdmin();let q=query(entriesCol,where("uid","==",u.uid));unsubAdmin=onSnapshot(q,s=>{let all=s.docs.map(d=>Object.assign({id:d.id},d.data()));adminEvents=all.filter(x=>x.kind==="event");adminPeriods=all.filter(x=>x.kind==="outsidePeriod");renderAdminHistory()})}
function renderAdminHistory(){let t=T[lang];$("adminMonthMain").textContent=ymLabel(adminMonthYM);let days=new Set(adminEvents.filter(e=>e.date?.startsWith(adminMonthYM)).map(e=>e.date));outsideDatesInMonth(adminPeriods,adminMonthYM).forEach(d=>days.add(d));let arr=[...days].sort().reverse(),h="";if(arr.length){let s=computeSummary(adminEvents,adminPeriods,adminMonthYM);let adminNights=nightsAwayInMonth(adminEvents,adminMonthYM);h='<table><thead><tr><th>Data</th><th>Giorno</th><th class="valcol"><span class="th-ico">🚚</span><span class="th-lbl">'+t.colTravel+'</span></th><th class="valcol"><span class="th-ico">🟢</span><span class="th-lbl">'+t.colWork+'</span></th><th class="valcol"><span class="th-ico">🌞</span><span class="th-lbl">'+t.colDay+'</span></th><th class="valcol"><span class="th-ico">🌙</span><span class="th-lbl">'+t.colNight+'</span></th><th class="valcol"><span class="th-ico">☕</span><span class="th-lbl">'+t.colBreak+'</span></th><th class="valcol"><span class="th-ico">🏨</span><span class="th-lbl">'+t.colOutside+'</span></th></tr></thead><tbody>';for(let d of arr){let m=minutesForDay(adminEvents.filter(e=>e.date===d)),out=adminNights.has(d);h+='<tr><td>'+d.split("-").reverse().join("/")+'</td><td>'+dayName(d).slice(0,3)+'</td><td class="valcol">'+fmtMin(m.travel)+'</td><td class="valcol">'+fmtMin(m.work)+'</td><td class="valcol">'+fmtMin(m.workDay)+'</td><td class="valcol">'+fmtMin(m.workNight)+'</td><td class="valcol">'+fmtMin(m.br)+'</td><td class="valcol">'+(out?"✓":"—")+"</td></tr>"}h+='</tbody><tfoot><tr><td>'+t.colTotal+'</td><td></td><td class="valcol tot-travel">'+fmtMin(s.travel)+'</td><td class="valcol tot-work">'+fmtMin(s.work)+'</td><td class="valcol">'+fmtMin(s.workDay)+'</td><td class="valcol">'+fmtMin(s.workNight)+'</td><td class="valcol">'+fmtMin(s.br)+'</td><td class="valcol">'+s.outside+'</td></tr></tfoot></table>'}else h='<div class="empty">'+t.noData+"</div>";$("adminHistory").innerHTML=h}

function boot(){
  onAuthStateChanged(auth, async (u) => {
    if(u){
      try{
        let s = await getDoc(doc(usersCol, u.uid));
        if(s.exists()){
          let d = s.data();
          session = {
            uid: u.uid,
            username: d.username,
            usernameLower: d.usernameLower,
            role: d.role || "user",
            language: d.language || "it",
            tariffaOraria: +d.tariffaOraria || 0,
            percentualeOraViaggio: d.percentualeOraViaggio ?? 100,
            maggiorazioneStraordinario: +d.maggiorazioneStraordinario || 0,
            indennitaTrasferta: +d.indennitaTrasferta || 0
          };
          saveSession();
          if(session.role === "admin") enterAdmin();
          else enterApp();
          return;
        }
      }catch(e){ console.error(e); }
    }
    clearSession();
    show("loginView");
    setLang("it");
  });
}
boot();
</script></body></html>
