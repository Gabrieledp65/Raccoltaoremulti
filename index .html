async function handleAction(ev,btn){let date=todayISO(),outside=activeOutside();if(btn){setLoading(btn,T[lang].saving||"Salvataggio…");}try{
if(ev==="travel_start") await addEvent("travel_start",date,{periodId:outside?.id||null,context:"outbound"});
else if(ev==="travel_end"){let es=dayEvents(date),last=es[es.length-1];await addEvent("travel_end",date,{periodId:outside?.id||null,context:last?.context||"outbound"});if(last?.context==="return") showReturnChoice();}
else if(ev==="work_start") await addEvent("work_start",date,{periodId:outside?.id||null});
else if(ev==="break_start") await addEvent("break_start");
else if(ev==="resume") await addEvent("break_end");
else if(ev==="work_end"){await addEvent("work_end");showEndChoice();return}
else if(ev==="overnight"){if(!outside){let id=await startOutside();if(id)await addEvent("overnight",date,{periodId:id});}else await addEvent("overnight",date,{periodId:outside.id});}
else if(ev==="day_end") await addEvent("day_end");
else if(ev==="outside_end") await closeOutside();
renderState();renderToday();renderHistory()}catch(err){console.error(err);alert("Errore durante il salvataggio dell’azione. Controlla la connessione e le regole Firebase.");}finally{if(btn)clearLoading(btn)}}
function showEndChoice(){let t=T[lang];openModal(t.endWork,"<p>Hai terminato il lavoro. Cosa succede adesso?</p>",[[t.endTravel,async()=>{await addEvent("travel_start",todayISO(),{periodId:activeOutside()?.id||null,context:"return"});closeModal();renderState()}],[t.overnight,async()=>{if(!activeOutside())await startOutside();else await addEvent("overnight",todayISO(),{periodId:activeOutside().id});closeModal();renderState()}],[t.finishDay,async()=>{await addEvent("day_end");closeModal();renderState()}]])}
function showReturnChoice(){let t=T[lang];openModal(t.endTravel,"<p>Rientro completato. Chiudi la giornata o termina anche il periodo fuori sede?</p>",[[t.finishOutside,async()=>{await closeOutside();await addEvent("day_end");closeModal();renderState()}],[t.finishDay,async()=>{await addEvent("day_end");closeModal();renderState()}]])}
function renderToday(){if(!session||session.role==="admin")return;let es=dayEvents(todayISO());$("todayTitle").textContent=T[lang].today+" — "+dayName(todayISO());let box=$("todayTimeline");box.innerHTML="";if(!es.length){box.innerHTML='<div class="empty">'+T[lang].noData+'</div>';return}es.forEach(e=>{let [ico,desc,cl]=eventLabel(e),d=document.createElement("div");d.className="event";d.innerHTML='<div class="time">'+e.time+'</div><div class="ico">'+ico+'</div><div class="desc"><strong>'+desc+'</strong></div>';box.appendChild(d)})}
function minutesForDay(es){let work=0,travel=0,br=0,ws=null,ts=null,bs=null;for(let e of es.slice().sort(eventSort)){if(e.type==="work_start"||e.type==="break_end")ws=e.time;if(e.type==="work_end"&&ws){work+=minDiff(ws,e.time);ws=null}if(e.type==="travel_start")ts=e.time;if(e.type==="travel_end"&&ts){travel+=minDiff(ts,e.time);ts=null}if(e.type==="break_start")bs=e.time;if(e.type==="break_end"&&bs){br+=minDiff(bs,e.time);bs=null}}return {work,travel,br}}
function dateRange(start,end){let out=[],d=parseDate(start),last=parseDate(end);while(d<=last){out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));d.setDate(d.getDate()+1)}return out}
function outsideDatesInMonth(periods,ym){let set=new Set(),first=ym+"-01",last=ym+"-31";periods.forEach(p=>{let end=p.endDate||todayISO();let a=p.startDate<first?first:p.startDate,b=end>last?last:end;if(a<=b)dateRange(a,b).forEach(d=>set.add(d))});return set}
function renderHistory(){if(!session||session.role==="admin")return;$('monthMain').textContent=ymLabel(monthYM);let days=new Set(myEvents.filter(e=>e.date?.startsWith(monthYM)).map(e=>e.date));outsideDatesInMonth(outsidePeriods,monthYM).forEach(d=>days.add(d));let arr=[...days].sort().reverse(),h='<table><thead><tr><th>Data</th><th>Giorno</th><th>🚚</th><th>🟢</th><th>☕</th><th>🏨</th></tr></thead><tbody>';if(!arr.length){$('historyTable').innerHTML='<div class="empty">'+T[lang].noData+'</div>';return}for(let d of arr){let es=dayEvents(d),m=minutesForDay(es),out=outsidePeriods.some(p=>p.startDate<=d&&(p.status==="open"||p.endDate>=d));h+='<tr><td>'+d.split("-").reverse().join("/")+'</td><td>'+dayName(d).slice(0,3)+'</td><td class="num">'+fmtMin(m.travel)+'</td><td class="num">'+fmtMin(m.work)+'</td><td class="num">'+fmtMin(m.br)+'</td><td>'+(out?'✓':'—')+'</td></tr>'}h+='</tbody></table>';$('historyTable').innerHTML=h}
function computeSummary(events,periods,ym){let days=new Set(events.filter(e=>e.date?.startsWith(ym)).map(e=>e.date));outsideDatesInMonth(periods,ym).forEach(d=>days.add(d));let work=0,travel=0,br=0;[...days].forEach(d=>{let m=minutesForDay(events.filter(e=>e.date===d));work+=m.work;travel+=m.travel;br+=m.br});return {work,travel,br,outside:outsideDatesInMonth(periods,ym).size}}
function openModal(title,body,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;let b=$("modalButtons");b.innerHTML="";buttons.forEach(([label,fn],i)=>{let x=document.createElement("button");x.className="btn "+(i===0?"btn-primary":"btn-secondary");x.textContent=label;x.onclick=fn;b.appendChild(x)});$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
function renderAdminUsers(){let box=$("adminUsers");box.innerHTML="";let arr=window.adminUsers||[];if(!arr.length){box.innerHTML='<div class="empty">Nessun utente</div>';return}arr.filter(u=>u.role!=="admin").forEach(u=>{let d=document.createElement("div");d.className="admin-user";d.innerHTML='<span><strong>'+u.username+'</strong><br><small>'+((u.language||"it").toUpperCase())+'</small></span><button class="btn btn-secondary">Apri</button>';d.querySelector("button").onclick=()=>openAdmin(u);box.appendChild(d)})}
function subscribeUsers(){onSnapshot(usersCol,s=>{window.adminUsers=s.docs.map(d=>Object.assign({usernameLower:d.id},d.data()));renderAdminUsers()})}
function openAdmin(u){adminUser=u;$("adminReport").classList.remove("hidden");$("adminTitle").textContent="Report — "+u.username;adminMonthYM=currentYM();if(unsubAdmin)unsubAdmin();let q=query(entriesCol,where("usernameLower","==",u.usernameLower));unsubAdmin=onSnapshot(q,s=>{let all=s.docs.map(d=>Object.assign({id:d.id},d.data()));adminEvents=all.filter(x=>x.kind==="event");adminPeriods=all.filter(x=>x.kind==="outsidePeriod");renderAdminHistory()})}
function renderAdminHistory(){ $('adminMonthMain').textContent=ymLabel(adminMonthYM);let days=new Set(adminEvents.filter(e=>e.date?.startsWith(adminMonthYM)).map(e=>e.date));outsideDatesInMonth(adminPeriods,adminMonthYM).forEach(d=>days.add(d));let arr=[...days].sort().reverse();let h='<table><thead><tr><th>Data</th><th>Giorno</th><th>Viaggio</th><th>Lavoro</th><th>Pausa</th><th>Fuori sede</th></tr></thead><tbody>';for(let d of arr){let m=minutesForDay(adminEvents.filter(e=>e.date===d));let out=adminPeriods.some(p=>p.startDate<=d&&(p.status==="open"||p.endDate>=d));h+='<tr><td>'+d+'</td><td>'+dayName(d).slice(0,3)+'</td><td>'+fmtMin(m.travel)+'</td><td>'+fmtMin(m.work)+'</td><td>'+fmtMin(m.br)+'</td><td>'+(out?'✓':'—')+'</td></tr>'}h+='</tbody></table>';$('adminHistory').innerHTML=arr.length?h:'<div class="empty">'+T[lang].noData+'</div>'}
function summaryFor(events,periods,ym){let s=computeSummary(events,periods,ym);return '<div class="summary-grid"><div class="summary"><div class="lbl">'+T[lang].workHours+'</div><div class="val">'+fmtMin(s.work)+'</div></div><div class="summary"><div class="lbl">'+T[lang].travelHours+'</div><div class="val">'+fmtMin(s.travel)+'</div></div><div class="summary"><div class="lbl">'+T[lang].breakHours+'</div><div class="val">'+fmtMin(s.br)+'</div></div><div class="summary"><div class="lbl">'+T[lang].outsideDays+'</div><div class="val">'+s.outside+'</div></div></div>'}
function printHtml(title,table,summary){let w=window.open("","_blank","noopener");if(!w){alert("Il browser ha bloccato la finestra di stampa. Consenti i popup per questo sito.");return}w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:Arial;padding:25px;color:#17312a}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:7px;text-align:left}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary{border:1px solid #ddd;padding:8px}.val{font-size:18px;font-weight:bold}.lbl{font-size:10px;color:#666}</style></head><body><h1>'+title+'</h1>'+summary+table+'</body></html>');w.document.close();setTimeout(()=>{w.focus();w.print()},150)}
async function downloadPDF(title,events,periods,ym){if(window.jspdf===undefined){await new Promise((resolve,reject)=>{let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}let jsPDF=window.jspdf.jsPDF,doc=new jsPDF({unit:"mm",format:"a4"}),s=computeSummary(events,periods,ym);doc.setFontSize(17);doc.text(title,14,16);doc.setFontSize(9);doc.text(ymLabel(ym),14,23);doc.setFontSize(11);doc.text("Ore lavoro: "+fmtMin(s.work),14,32);doc.text("Ore viaggio: "+fmtMin(s.travel),65,32);doc.text("Pause: "+fmtMin(s.br),115,32);doc.text("Giorni fuori sede: "+s.outside,155,32);let y=42;doc.setFontSize(9);doc.text("Data",14,y);doc.text("Giorno",38,y);doc.text("Viaggio",65,y);doc.text("Lavoro",90,y);doc.text("Pause",115,y);doc.text("Fuori sede",140,y);y+=6;let days=new Set(events.filter(e=>e.date?.startsWith(ym)).map(e=>e.date));outsideDatesInMonth(periods,ym).forEach(d=>days.add(d));for(let d of [...days].sort()){if(y>280){doc.addPage();y=18}let m=minutesForDay(events.filter(e=>e.date===d)),out=outsideDatesInMonth(periods,ym).has(d);doc.text(d,14,y);doc.text(dayName(d).slice(0,3),38,y);doc.text(fmtMin(m.travel),65,y);doc.text(fmtMin(m.work),90,y);doc.text(fmtMin(m.br),115,y);doc.text(out?"SI":"NO",140,y);y+=6}doc.save(title.replace(/[^a-z0-9_-]/gi,"_")+".pdf")}
function subscribe(){
  if(unsub) unsub();
  const q=query(entriesCol,where("usernameLower","==",session.usernameLower));
  unsub=onSnapshot(q,snap=>{
    const all=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    myEvents=all.filter(x=>x.kind==="event").sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));
    outsidePeriods=all.filter(x=>x.kind==="outsidePeriod");
    renderState(); renderToday(); renderHistory();
  },err=>{console.error("Firestore listener:",err);});
}
function enterApp(){lang=session.language||"it";setLang(lang);show("appView");$("sessionUser").textContent=session.username;subscribe();renderState();renderToday();renderHistory()}
function enterAdmin(){show("adminView");$("adminSession").textContent=session.username;subscribeUsers()}
$("languageSelect").onchange=e=>setLang(e.target.value);
$("loginBtn").onclick=async()=>{let b=$("loginBtn");setLoading(b,"…");let r=await auth($("loginUser").value,$("loginPass").value,$("languageSelect").value);clearLoading(b);if(!r.ok){$("loginError").textContent=r.msg;$("loginError").classList.add("show");return}$("loginError").classList.remove("show");if(session.role==="admin")enterAdmin();else enterApp()};
$("logoutBtn").onclick=()=>{if(unsub)unsub();clearSession();location.reload()};$("adminLogout").onclick=()=>{clearSession();location.reload()};$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
$("prevMonth").onclick=()=>{monthYM=shiftYM(monthYM,-1);renderHistory()};$("nextMonth").onclick=()=>{monthYM=shiftYM(monthYM,1);renderHistory()};$("currentMonth").onclick=()=>{monthYM=currentYM();renderHistory()};
$("summaryBtn").onclick=()=>openModal(T[lang].summary,summaryFor(myEvents,outsidePeriods,monthYM),[["OK",closeModal]]);$("printBtn").onclick=()=>{let table=$("historyTable").innerHTML;printHtml("Foglio Ore — "+session.username,table,summaryFor(myEvents,outsidePeriods,monthYM))};$("pdfBtn").onclick=()=>downloadPDF("Foglio_Ore_"+monthYM,myEvents,outsidePeriods,monthYM);
$("adminBack").onclick=()=>{$("adminReport").classList.add("hidden");adminUser=null;if(unsubAdmin){unsubAdmin();unsubAdmin=null}};$("adminPrev").onclick=()=>{adminMonthYM=shiftYM(adminMonthYM,-1);renderAdminHistory()};$("adminNext").onclick=()=>{adminMonthYM=shiftYM(adminMonthYM,1);renderAdminHistory()};$("adminCurrent").onclick=()=>{adminMonthYM=currentYM();renderAdminHistory()};$("adminSummary").onclick=()=>openModal("Riepilogo",summaryFor(adminEvents,adminPeriods,adminMonthYM),[["OK",closeModal]]);$("adminPrint").onclick=()=>printHtml("Foglio Ore — "+(adminUser?.username||""),$("adminHistory").innerHTML,summaryFor(adminEvents,adminPeriods,adminMonthYM));$("adminPdf").onclick=()=>downloadPDF("Foglio_Ore_"+(adminUser?.username||""),adminEvents,adminPeriods,adminMonthYM);
$("settingsBtn").onclick=()=>{openModal("Impostazioni","<div class='field'><label>Lingua</label><select id='modalLang'><option value='it'>Italiano</option><option value='en'>English</option><option value='fr'>Français</option><option value='ar'>العربية</option></select></div>",[["Salva",async()=>{let l=$("modalLang").value;await updateDoc(doc(usersCol,session.usernameLower),{language:l});session.language=l;saveSession();setLang(l);closeModal()}],["Annulla",closeModal]]);$("modalLang").value=lang};
async function boot(){session=loadSession();if(!session){show("loginView");setLang("it");return}try{let s=await getDoc(doc(usersCol,session.usernameLower));if(!s.exists()){clearSession();show("loginView");return}let d=s.data();session.role=d.role||"user";session.language=d.language||"it";session.username=d.username||session.username;saveSession();if(session.role==="admin")enterAdmin();else enterApp()}catch(e){if(session.role==="admin")enterAdmin();else enterApp()}}
boot();
</script></body></html>
